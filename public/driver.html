<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zippy — Driver</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="p-3">
    <div class="d-flex align-items-center gap-2 mb-3">
      <h1 class="h4 mb-0">Driver</h1>
      <span data-field="connection" class="badge bg-secondary">disconnected</span>
      <span data-field="session" class="text-muted small">signed out</span>
      <a href="/" class="ms-auto small">index</a>
    </div>

    <div data-field="error" class="alert alert-danger" hidden></div>

    <form data-panel="login" class="row g-2 mb-3" onsubmit="return false">
      <div class="col-auto">
        <input id="email" class="form-control" value="driver-metrocab-1@zippy.internal" />
      </div>
      <div class="col-auto">
        <input id="password" type="password" class="form-control" value="password-dev-only" />
      </div>
      <div class="col-auto">
        <button data-action="login" class="btn btn-primary">Sign in</button>
      </div>
    </form>

    <div data-panel="workspace" hidden>
      <h2 class="h6">Report a breakdown</h2>
      <form class="row g-2 mb-3" onsubmit="return false">
        <div class="col-auto">
          <input id="vehicleId" class="form-control" value="vehicle-metrocab-1" />
        </div>
        <div class="col-auto">
          <select id="complaint" class="form-select">
            <option>WONT_START</option>
            <option>FLAT_TYRE</option>
            <option>LOCKED_OUT</option>
            <option>WARNING_LIGHT</option>
            <option>NOISE_OR_SMELL</option>
            <option>STUCK_OR_DAMAGED</option>
            <option>UNKNOWN</option>
          </select>
        </div>
        <div class="col-auto"><input id="lat" class="form-control" value="12.9352" /></div>
        <div class="col-auto"><input id="lng" class="form-control" value="77.6245" /></div>
        <div class="col-auto">
          <select id="roadPosition" class="form-select">
            <option>SERVICE_ROAD</option>
            <option>SHOULDER</option>
            <option>LANE</option>
            <option>PARKING</option>
          </select>
        </div>
        <div class="col-auto form-check mt-2">
          <input id="onHighway" type="checkbox" class="form-check-input" />
          <label class="form-check-label" for="onHighway">on highway</label>
        </div>
        <div class="col-auto form-check mt-2">
          <input id="driverAlone" type="checkbox" class="form-check-input" checked />
          <label class="form-check-label" for="driverAlone">alone</label>
        </div>
        <div class="col-auto">
          <button data-action="report" class="btn btn-danger">Report</button>
        </div>
      </form>

      <div data-panel="intake-question" class="mb-3" hidden>
        <h2 class="h6">Intake</h2>
        <p data-field="question-prompt" class="mb-2"></p>
        <div data-field="question-answers"></div>
        <div data-field="intake-done" class="alert alert-success mt-2" hidden></div>
      </div>

      <h2 class="h6">Job <code data-field="active-job">none</code></h2>
      <ul class="list-group" data-panel="job-events"></ul>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/morphdom@2.7.4/dist/morphdom-umd.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="/js/pages/driver.js"></script>
  </body>
</html>
