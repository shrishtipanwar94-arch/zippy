<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zippy — Fleet</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="/css/tokens.css" rel="stylesheet" />
  </head>
  <body class="p-3 console">
    <div class="d-flex align-items-center gap-2 mb-3">
      <h1 class="h4 mb-0">Fleet dashboard</h1>
      <span data-field="connection" class="badge bg-secondary">disconnected</span>
      <span data-field="session" class="text-muted small">signed out</span>
      <button data-action="refresh" class="btn btn-outline-light btn-sm ms-auto">Refresh</button>
      <a href="/" class="small">index</a>
    </div>

    <div data-field="error" class="alert alert-danger" hidden></div>

    <form data-panel="login" class="row g-2 mb-3" onsubmit="return false">
      <div class="col-auto">
        <input id="email" class="form-control" value="fm-metrocab@zippy.internal" />
      </div>
      <div class="col-auto">
        <input id="password" type="password" class="form-control" value="password-dev-only" />
      </div>
      <div class="col-auto">
        <button data-action="login" class="btn btn-primary">Sign in</button>
      </div>
    </form>

    <div data-panel="workspace" hidden>
      <div data-panel="fleet-dashboard"></div>
    </div>

    <script type="module" src="/js/pages/fleet.js"></script>
  </body>
</html>
