<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zippy — Fleet</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="/css/tokens.css" rel="stylesheet" />
    <link href="/css/components.css" rel="stylesheet" />
    <link href="/css/console.css" rel="stylesheet" />
  </head>
  <body class="p-3 console">
    <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
      <span class="wordmark"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 2 4 13.2h6.2L9.8 22 20 10.4h-6.4z" /></svg>Zippy</span>
      <h1 class="app-bar-role">Fleet dashboard</h1>
      <!-- NO CONNECTION BADGE ON THIS PAGE. It used to sit here and it read
           "No connection" permanently: pages/fleet.js deliberately opens no
           socket (a fleet manager gets a coalesced summary, not a live feed),
           so `state.connection` never left its initial 'disconnected' and the
           badge un-hid the moment somebody signed in. It was reporting a
           socket nobody had opened, which is the same wrong sentence the
           signed-out case was fixed for. The Refresh button on the right is
           this page's honest affordance. -->
      <span data-field="session" class="text-muted small">signed out</span>
      <button data-action="refresh" class="btn btn-outline-light btn-sm ms-auto">Refresh</button>
      <a href="/" class="small">All surfaces</a>
    </div>

    <div data-field="error" class="alert alert-danger" hidden></div>

    <!-- SIGN IN — a centred card carrying the mark and the surface being
         entered. This page carries no connection badge at all; see above. -->
    <form data-panel="login" class="signin" onsubmit="return false">
      <div class="signin-card">
        <span class="wordmark signin-mark">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 2 4 13.2h6.2L9.8 22 20 10.4h-6.4z" /></svg>
          Zippy
        </span>
        <p class="signin-role">Fleet manager</p>
        <div class="signin-field">
          <label class="signin-label" for="email">Email</label>
          <input id="email" class="form-control" value="fm-metrocab@zippy.internal" />
        </div>
        <div class="signin-field">
          <label class="signin-label" for="password">Password</label>
          <input id="password" type="password" class="form-control" value="password-dev-only" />
        </div>
        <button data-action="login" class="btn btn-primary signin-submit">Sign in</button>
      </div>
    </form>

    <div data-panel="workspace" hidden>
      <div data-panel="fleet-dashboard"></div>
    </div>

    <script type="module" src="/js/pages/fleet.js"></script>
  </body>
</html>
