services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zippy
    ports:
      # Host 5433, not 5432: this dev machine runs a native PostgreSQL service
      # on 5432. Change back to "5432:5432" if that service is ever removed.
      - "5433:5432"
    volumes:
      - zippy_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zippy"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - zippy_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # SELF-HOSTED ROUTING (Phase 6) — never a hosted maps API. See
  # src/infra/routing.ts for why calling out to Google Maps or Mapbox would
  # break reproducible evaluation runs.
  #
  # This service only SERVES a map that has already been preprocessed — it
  # does not download or build anything itself. Run scripts/setup-osrm.sh
  # once first; that script downloads the OpenStreetMap road network for Delhi
  # (the city every seeded zone is in) and runs OSRM's extract/partition/
  # customise pipeline into ./osrm/data, which this container then serves.
  # `--algorithm mld` matches the partition+customise steps that pipeline
  # runs — OSRM's other algorithm (contraction hierarchies) needs a different
  # preprocessing step and the two are not interchangeable.
  #
  # No healthcheck: unlike Postgres and Redis, which the app treats as hard
  # dependencies it cannot run without, a missing or not-yet-built OSRM is an
  # EXPECTED, handled state — src/infra/routing.ts falls back to a haversine
  # estimate and marks it degraded rather than failing. A healthcheck here
  # would only be read by a human, and `docker compose ps` already shows
  # whether the container is running.
  osrm:
    image: osrm/osrm-backend
    command: ["osrm-routed", "--algorithm", "mld", "/data/delhi.osrm"]
    ports:
      - "5001:5000"
    volumes:
      - ./osrm/data:/data

volumes:
  zippy_postgres_data:
  zippy_redis_data:
